[project]
name = "iureti-discovery"
version = "0.2.0"
description = "Sonda de autodescubrimiento de recursos de TI para el inventario de iurefficient"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pysnmp>=7.1",
    "httpx>=0.27",
    "anthropic>=1.9.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
iureti-discovery = "iureti_discovery.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iureti_discovery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
