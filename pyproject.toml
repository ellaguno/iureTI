[project]
name = "iureti-discovery"
version = "0.5.0"
description = "Sonda de autodescubrimiento de recursos de TI para el inventario de iurefficient"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eduardo Llaguno", email = "eduardo@llaguno.com" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pysnmp>=7.1",
    "httpx>=0.27",
    "anthropic>=1.9.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
iureti-discovery = "iureti_discovery.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/ellaguno/iureTI"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iureti_discovery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
