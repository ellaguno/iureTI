name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Sintaxis de scripts de empaquetado
        run: |
          sh -n install.sh
          for f in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/iureti-discovery-wrapper; do sh -n "$f"; done
          bash -n packaging/build-deb.sh
